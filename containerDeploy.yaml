
---
- name: Deploy Banking Application on AWS EC2
  hosts: bankpro-server
  become: true

  tasks:
    - name: Update APT package cache
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull latest Banking application image
      command: docker pull {{ dockerImageTag }}

    - name: Remove existing container
      command: docker rm -f {{ containerName }}
      failed_when: false

    - name: Deploy Banking application
      command: >
        docker run -d
        --name {{ containerName }}
        -p {{ httpPort }}:8080
        {{ dockerImageTag }}

    - name: Verify deployed container
      command: docker ps
      register: container_status

    - name: Display running containers
      debug:
        var: container_status.stdout


